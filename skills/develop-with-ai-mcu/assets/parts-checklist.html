<meta charset="utf-8">
<div id="mcu-parts-panel">
  <style>
    #mcu-parts-panel { color-scheme: light dark; font: 16px/1.5 system-ui,sans-serif; color: light-dark(#152b32,#ecf3f4); background: light-dark(#f6f9f8,#162024); padding: 24px; max-width: 1000px; margin: auto; border-radius: 16px; }
    #mcu-parts-panel * { box-sizing: border-box; }
    #mcu-parts-panel h1 { font-size: 1.5em; margin: 0 0 6px; }
    #mcu-parts-panel p { margin: 8px 0 16px; }
    #mcu-parts-panel .table-wrap { overflow-x: auto; }
    #mcu-parts-panel table { border-collapse: collapse; width: 100%; text-align: start; }
    #mcu-parts-panel caption { text-align: start; padding: 8px 0; font-weight: 600; }
    #mcu-parts-panel th, #mcu-parts-panel td { padding: 12px 10px; border-bottom: 1px solid light-dark(#d6e1e0,#3a4b50); vertical-align: top; }
    #mcu-parts-panel td:first-child { min-width: 90px; }
    #mcu-parts-panel td:nth-child(2) { min-width: 190px; }
    #mcu-parts-panel small { display: block; font-size: .85em; margin-top: 4px; }
    #mcu-parts-panel input[type=checkbox] { width: 20px; height: 20px; accent-color: #14836f; cursor: pointer; }
    #mcu-parts-panel .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-top: 20px; }
    #mcu-parts-panel label { display: block; }
    #mcu-parts-panel input[type=text], #mcu-parts-panel select, #mcu-parts-panel button, #mcu-parts-panel textarea { font: inherit; border: 1px solid light-dark(#b7c9c7,#52676d); border-radius: 8px; padding: 9px 12px; background: light-dark(#fff,#202e33); color: inherit; }
    #mcu-parts-panel input[type=text] { max-width: 100%; width: 260px; }
    #mcu-parts-panel button { cursor: pointer; min-height: 44px; }
    #mcu-parts-panel button.primary { background: #126d5c; color: #fff; border-color: #126d5c; }
    #mcu-parts-panel button:disabled { opacity: .55; cursor: default; }
    #mcu-parts-panel :focus-visible { outline: 3px solid #ba8215; outline-offset: 3px; }
    #mcu-parts-panel a { color: light-dark(#086a58,#83dec9); }
    #mcu-parts-panel textarea { width: 100%; min-height: 170px; margin: 8px 0; }
    #mcu-parts-panel [hidden] { display: none; }
    #mcu-parts-panel #parts-summary { font-weight: 600; }
    @media (max-width: 540px) { #mcu-parts-panel { padding: 14px; } #mcu-parts-panel .controls > * { width: 100%; } }
  </style>
  <h1 id="parts-title">Parts checklist</h1>
  <p id="parts-intro"></p>
  <div class="table-wrap">
    <table>
      <caption id="parts-caption"></caption>
      <thead><tr id="parts-columns"></tr></thead>
      <tbody id="parts-rows"></tbody>
    </table>
  </div>
  <p id="parts-summary" aria-live="polite"></p>
  <p id="parts-cost-note"></p>
  <p id="parts-cart-question"></p>
  <div class="controls">
    <label><span id="parts-region-label"></span><br><input id="parts-region" type="text" autocomplete="off" maxlength="120"></label>
    <label><span id="parts-site-label"></span><br><input id="parts-site" type="text" autocomplete="off" maxlength="200"></label>
    <label><span id="parts-scope-label"></span><br><select id="parts-scope"><option value="missing"></option><option value="all"></option></select></label>
    <button id="parts-ask" class="primary" type="button"></button>
    <button id="parts-cart" type="button"></button>
  </div>
  <p id="parts-notice" role="status"></p>
  <div id="parts-request-box" hidden>
    <label for="parts-request" id="parts-request-label"></label>
    <textarea id="parts-request" readonly></textarea>
    <button id="parts-copy" type="button"></button>
  </div>
  <noscript>Open this checklist with JavaScript enabled to use its controls.</noscript>
  <script type="application/json" id="parts-data">

</div>
<script id="checklist-app">

    sent: 'Request sent to your AI.', volatile: 'Progress could not be saved here; keep this page open.', saved: 'Progress saved.', empty: 'All items are ready. Choose all items if you still want links.',

  },
  zh: {
    title: '材料检查清单', intro: '确认所需数量已备齐后再勾选。购买链接仅供参考，也可以买其他店铺的同规格材料。',
    columns: ['已备齐', '材料与规格', '数量', '用途', '新增费用', '链接'], owned: '已有材料', ready: '已备齐', missing: '缺少', unknown: '待核价', link: '参考商品',
    summary: (r,n) => `${n} 项材料中已备齐 ${r} 项`, cost: (v,n) => `缺件预计费用：${v}${n ? `，另有 ${n} 项待核价` : ''}`,
    costNote: '费用为估算；购买前需核实运费、耗材和现价。', region: '国家或地区（可选）', scope: '查找范围', scopes: ['只查缺件', '全部材料'],

    sent: '已把请求发给 AI。', volatile: '此处无法保存进度，请暂时保留页面。', saved: '进度已保存。', empty: '材料已备齐；如仍需链接，请选择全部材料。',
    prompt: '请为这些材料查找当前可购买的参考链接，核对规格、数量和配送地区，说明未核实的库存、价格与运费。不限指定店铺，同规格替代可以。不代我下单。',
    noRegion: '选择店铺前，请先问我所在的国家或地区。', project: '项目', ship: '配送地区', language: '请用中文回复。',
    site: '购买网站（可选）', noSite: '选商品或加购前，请先问我使用哪个网站。', cartQuestion: '需要 AI 在你指定的网站选好缺件，并加入购物车吗？',
    cart: '让 AI 选购并加入购物车', cartPrepare: '生成代选加购物车请求', cartEmpty: '材料已备齐，没有需要加购的缺件。',
    cartPrompt: '请用 $select-products-to-cart 只处理下方缺件。在我指定的网站核对规格、包装数量、配送及商品加运费的费用，比较合格候选。先检查当前购物车，只补齐同一商品和规格的数量差额，保留其他商品，避免重复添加。选好后加入购物车并核实结果；不进入结算、不下单、不支付、不接受订阅。'
  },

    title: 'Lista de materiales', intro: 'Marca un material cuando tengas la cantidad necesaria. Los enlaces son ejemplos; puedes comprar piezas equivalentes en otras tiendas.',
    columns: ['Listo', 'Material y especificación', 'Cantidad', 'Uso', 'Coste adicional', 'Enlace'], owned: 'Ya disponible', ready: 'Listo', missing: 'Falta', unknown: 'Sin precio', link: 'Producto de referencia',
    summary: (r,n) => `${r} de ${n} materiales listos`, cost: (v,n) => `Coste estimado de lo que falta: ${v}${n ? ` + ${n} material(es) sin precio` : ''}`,
    costNote: 'Solo estimaciones. Comprueba envío, consumibles y precios antes de comprar.', region: 'País o región (opcional)', scope: 'Buscar enlaces para', scopes: ['Lo que falta', 'Todos los materiales'],
    ask: 'Pedir enlaces de compra a la IA', prepare: 'Preparar solicitud de enlaces', request: 'Copia esta solicitud a tu IA', copy: 'Copiar solicitud', copied: 'Solicitud copiada.', select: 'Selecciona y copia el texto de arriba.',

    prompt: 'Busca enlaces de compra actuales y opcionales para estos materiales. Comprueba especificaciones, cantidades y región de entrega; indica dudas sobre existencias, precios y envío. Se aceptan tiendas equivalentes. No hagas ningún pedido.',
    noRegion: 'Pregunta primero por el país o la región antes de elegir tiendas.', project: 'Proyecto', ship: 'Región de entrega', language: 'Responde en español.',
    site: 'Sitio de compra (opcional)', noSite: 'Pregunta qué sitio usar antes de elegir productos o añadirlos.', cartQuestion: '¿Quieres que la IA elija lo que falta en tu sitio y lo añada al carrito?',
    cart: 'Pedir selección y añadir al carrito', cartPrepare: 'Preparar solicitud de selección y carrito', cartEmpty: 'Todos los materiales están listos; no hay faltantes que añadir.',
    cartPrompt: 'Usa $select-products-to-cart solo para los materiales que faltan abajo. Compara variantes verificadas, cantidades por paquete, entrega y precio publicado más envío en mi sitio elegido. Revisa el carrito actual y completa solo la cantidad de la misma variante; conserva otros productos y evita duplicados. Añade lo elegido y verifica el carrito. No pases al pago, no hagas pedidos, no pagues ni aceptes suscripciones.'
  }
};

function validateChecklist(data) {
  if (!data || typeof data.projectId !== 'string' || !data.projectId.trim() || typeof data.projectName !== 'string' || !['en','zh','es'].includes(data.language) || !Array.isArray(data.parts)) throw new Error('Invalid checklist data');
  if (data.offerCart != null && typeof data.offerCart !== 'boolean') throw new Error('Invalid cart offer flag');
  if (data.cartOfferId != null && (typeof data.cartOfferId !== 'string' || !data.cartOfferId.trim() || data.cartOfferId.length > 120)) throw new Error('Invalid cart offer id');
  new Intl.NumberFormat(data.language, {style:'currency', currency:data.currency}).format(0);
  const ids = new Set();
  for (const part of data.parts) {
    if (!part || typeof part.id !== 'string' || !part.id.trim() || ['__proto__','constructor','prototype'].includes(part.id) || ids.has(part.id)) throw new Error('Invalid or duplicate part id');
    ids.add(part.id);
    if (!['name','specification','purpose'].every(k => typeof part[k] === 'string' && part[k].trim()) || !Number.isSafeInteger(part.quantity) || part.quantity < 1 || typeof part.owned !== 'boolean') throw new Error('Invalid part');
    if (part.unitPrice != null && (typeof part.unitPrice !== 'number' || !Number.isFinite(part.unitPrice * part.quantity) || part.unitPrice < 0)) throw new Error('Invalid price');
  }
}

function partSignature(part) {
  return JSON.stringify([part.specification, part.quantity]);
}

function restoreChecklist(data, saved) {
  validateChecklist(data);
  const old = saved && saved.version === 1 && saved.projectId === data.projectId ? saved : null;
  const rows = Object.create(null);
  for (const part of data.parts) {
    const previous = old?.rows?.[part.id];
    rows[part.id] = {signature: partSignature(part), ready: previous ? previous.signature === partSignature(part) && previous.ready === true : part.owned};
  }
  const oldOfferId=typeof old?.cartOfferId==='string' ? old.cartOfferId : 'initial';
  const cartOfferId=typeof data.cartOfferId==='string' ? data.cartOfferId : oldOfferId;
  const offerCart=data.offerCart===false ? false : old && oldOfferId===cartOfferId && typeof old.offerCart==='boolean' ? old.offerCart : true;
  return {version:1, projectId:data.projectId, region: typeof old?.region === 'string' ? old.region : (typeof data.region === 'string' ? data.region : ''), site: typeof old?.site === 'string' ? old.site : (typeof data.site === 'string' ? data.site : ''), cartOfferId, offerCart, rows};
}

function checklistSummary(data, state) {
  const missing = data.parts.filter(p => !state.rows[p.id].ready);
  return {ready:data.parts.length-missing.length, missingCount:missing.length, knownCost:missing.reduce((n,p) => n + (p.unitPrice == null ? 0 : p.unitPrice*p.quantity),0), unknownCostCount:missing.filter(p=>p.unitPrice == null).length};
}

function shoppingRequest(data, state, scope) {
  const t = CHECKLIST_TEXT[data.language];
  const parts = data.parts.filter(p => scope === 'all' || !state.rows[p.id].ready);
  return [t.prompt, `${t.project}: ${data.projectName}`, state.region.trim() ? `${t.ship}: ${state.region.trim()}` : t.noRegion,
    ...(state.site.trim() ? [`${t.site}: ${state.site.trim()}`] : []),
    ...parts.map(p=>`- ${p.name} | ${p.specification} | ${p.quantity}`), t.language].join('\n');
}

function cartRequest(data, state) {
  if (state.offerCart === false) return '';
  const t = CHECKLIST_TEXT[data.language], parts = data.parts.filter(p => !state.rows[p.id].ready);
  if (!parts.length) return t.cartEmpty;
  return [t.cartPrompt, `${t.project}: ${data.projectName}`, state.site.trim() ? `${t.site}: ${state.site.trim()}` : t.noSite,
    state.region.trim() ? `${t.ship}: ${state.region.trim()}` : t.noRegion,
    ...parts.map(p=>`- ${p.name} | ${p.specification} | ${p.quantity}`), t.language].join('\n');
}

function safeShopURL(value) {
  try { const u = new URL(value); return ['http:','https:'].includes(u.protocol) ? u.href : null; } catch { return null; }
}

if (typeof document !== 'undefined') {
  const root = document.getElementById('mcu-parts-panel');
  const el = id => root.querySelector(`#${id}`);
  try {
    const data = JSON.parse(el('parts-data').textContent);
    validateChecklist(data);
    const t = CHECKLIST_TEXT[data.language], host = window.openai, key = `mcu-parts:${data.projectId}`;
    let stored = null;
    try { stored = JSON.parse(localStorage.getItem(key)); } catch {}
    const fromHost = host?.widgetState?.privateContent?.checklist;
    let state = restoreChecklist(data, fromHost?.projectId === data.projectId ? fromHost : stored);
    root.lang = data.language;
    const money = n => new Intl.NumberFormat(data.language,{style:'currency',currency:data.currency}).format(n);
    const node = (tag,text) => { const n=document.createElement(tag); if(text != null) n.textContent=text; return n; };
    el('parts-title').textContent = `${t.title} · ${data.projectName}`;
    el('parts-intro').textContent=t.intro; el('parts-caption').textContent=data.projectName;
    for (const label of t.columns) { const th=node('th',label); th.scope='col'; el('parts-columns').append(th); }
    el('parts-region-label').textContent=t.region; el('parts-region').value=state.region;
    el('parts-site-label').textContent=t.site; el('parts-site').value=state.site;
    el('parts-cart-question').textContent=t.cartQuestion;
    el('parts-cart').textContent=typeof host?.sendFollowUpMessage==='function' ? t.cart : t.cartPrepare;
    el('parts-scope-label').textContent=t.scope;
    [...el('parts-scope').options].forEach((o,i)=>o.textContent=t.scopes[i]);
    el('parts-ask').textContent=typeof host?.sendFollowUpMessage==='function' ? t.ask : t.prepare;
    el('parts-copy').textContent=t.copy; el('parts-request-label').textContent=t.request;
    el('parts-cost-note').textContent=t.costNote;
    function render() {
      el('parts-rows').replaceChildren();
      for (const part of data.parts) {
        const row=node('tr'), readyCell=node('td'), label=node('label'), check=node('input');
        check.type='checkbox'; check.checked=state.rows[part.id].ready; check.setAttribute('aria-label',`${t.ready}: ${part.name}`);
        check.addEventListener('change',()=>{state.rows[part.id].ready=check.checked; render(); save(); el('parts-rows').querySelectorAll('input')[data.parts.indexOf(part)].focus();});
        label.append(check,node('small',check.checked?t.ready:t.missing)); readyCell.append(label); row.append(readyCell);
        const info=node('td'); info.append(node('strong',part.name),node('small',part.specification));
        if(part.owned) info.append(node('small',t.owned));
        row.append(info,node('td',part.quantity),node('td',part.purpose),node('td',state.rows[part.id].ready?money(0):part.unitPrice==null?t.unknown:money(part.unitPrice*part.quantity)));
        const linkCell=node('td'), url=safeShopURL(part.url);
        if(url) { const a=node('a',t.link); a.href=url; a.target='_blank'; a.rel='noopener noreferrer'; linkCell.append(a); }
        else linkCell.textContent='—';
        row.append(linkCell); el('parts-rows').append(row);
      }
      const total=checklistSummary(data,state);
      el('parts-summary').textContent=`${t.summary(total.ready,data.parts.length)} · ${t.cost(money(total.knownCost),total.unknownCostCount)}`;
      el('parts-ask').disabled=total.missingCount===0 && el('parts-scope').value==='missing';
      el('parts-cart').disabled=total.missingCount===0;
      el('parts-cart-question').hidden=!state.offerCart;
      el('parts-cart').hidden=!state.offerCart;
      el('parts-request-box').hidden=true;
    }
    function save() {
      let localSaved=false;
      try { localStorage.setItem(key,JSON.stringify(state)); localSaved=true; } catch {}
      el('parts-notice').textContent=localSaved?t.saved:t.volatile;
      const snapshot={modelContent:{projectId:data.projectId,region:state.region,site:state.site,missingIds:data.parts.filter(p=>!state.rows[p.id].ready).map(p=>p.id)},privateContent:{checklist:state}};
      if(typeof host?.setWidgetState==='function' && new TextEncoder().encode(JSON.stringify(snapshot)).length < 16384) {
        try { Promise.resolve(host.setWidgetState(snapshot)).then(()=>{el('parts-notice').textContent=t.saved;}).catch(()=>{}); } catch {}
      }
    }
    el('parts-region').addEventListener('input',()=>{state.region=el('parts-region').value; el('parts-request-box').hidden=true; save();});
    el('parts-site').addEventListener('input',()=>{state.site=el('parts-site').value; el('parts-request-box').hidden=true; save();});
    el('parts-scope').addEventListener('change',render);
    async function requestAI(prompt, title) {
      el('parts-request').value=prompt;
      if(typeof host?.sendFollowUpMessage==='function') {
        try { await host.sendFollowUpMessage({prompt,title}); el('parts-notice').textContent=t.sent; return; } catch {}
      }
      el('parts-request-box').hidden=false;
    }
    el('parts-ask').addEventListener('click',()=>requestAI(shoppingRequest(data,state,el('parts-scope').value),t.ask));
    el('parts-cart').addEventListener('click',()=>{
      if (!state.offerCart) return;
      const prompt=cartRequest(data,state);
      state.offerCart=false; el('parts-cart-question').hidden=true; el('parts-cart').hidden=true; save();
      return requestAI(prompt,t.cart);
    });
    el('parts-copy').addEventListener('click',async()=>{
      try { await navigator.clipboard.writeText(el('parts-request').value); el('parts-notice').textContent=t.copied; }
      catch { el('parts-request').focus(); el('parts-request').select(); el('parts-notice').textContent=t.select; }
    });
    window.addEventListener('openai:set_globals',event=>{
      const incoming=event.detail?.globals?.widgetState?.privateContent?.checklist;
      if(incoming?.projectId===data.projectId) {
        const next=restoreChecklist(data,incoming);
        if (state.cartOfferId===next.cartOfferId && state.offerCart===false) next.offerCart=false;
        state=next;el('parts-region').value=state.region;el('parts-site').value=state.site;render();
      }
    });
    render();
    if (typeof data.offerCart === 'boolean') save();
  } catch (error) {
    el('parts-notice').textContent=`Checklist error: ${error.message}`;
    el('parts-ask').disabled=true;
    el('parts-cart').disabled=true;
  }
}
</script>
